version: "3.8"

services:
  # Service 1: The PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: stellantis-postgres
    restart: always
    environment:
      POSTGRES_DB: stellantis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d stellantis_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service 2: The Meridian Copilot Web App
  meridian:
    build: .
    container_name: meridian-copilot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/stellantis_db
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
